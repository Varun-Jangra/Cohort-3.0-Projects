<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game - Landing Page</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="logo">
          <img src="images/logo.png" alt="Squid Game Logo" />
        </div>
        <div class="links">
          <a href="#">About</a>
          <a href="#" class="active">Watch now</a>
          <a href="#">Actors</a>
          <a href="#">Contact</a>
        </div>
        <div class="menu">
          <i class="ri-menu-3-line"></i>
        </div>
      </nav>

      <section class="hero">
        <div class="scroll-indicator">
          <span>SCROLL</span>
          <div class="line"></div>
        </div>

        <div class="socials">
          <i class="ri-twitter-x-line"></i>
          <i class="ri-instagram-line"></i>
          <i class="ri-facebook-circle-fill"></i>
        </div>

        <section class="left-section">
          <div class="left-top">
            <img src="images/main-logo.png" alt="Squid Game Title" />
          </div>
          <div class="left-center">
            <p>
              Action / Thriller / Drama Series directed by Dong-hyuk Hwang <br />
              Season 1: 9 Episodes
            </p>
          </div>
          <div class="left-bottom">
            <button class="button1">
              <i class="ri-play-circle-fill"></i> Play Now
            </button>
            <button class="button2">
              <i class="ri-play-line"></i> Watch Trailer
            </button>
          </div>
        </section>

        <section class="right">
          <img src="images/main.png" alt="Guard" />
        </section>

        <div class="bottom-container">
          <div class="bottom">
            <div class="card">
              <img src="images/3.png" alt="Scene 1" />
              <div class="play-overlay"><i class="ri-play-circle-fill"></i></div>
            </div>
            <div class="card">
              <img src="images/1.png" alt="Scene 2" />
              <div class="play-overlay"><i class="ri-play-circle-fill"></i></div>
            </div>
            <div class="card">
              <img src="images/2.png" alt="Scene 3" />
              <div class="play-overlay"><i class="ri-play-circle-fill"></i></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
